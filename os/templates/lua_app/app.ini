# The manifest (docs/os/platform/app-host.md, "Manifest"). One key=value per line.
# name: what the launcher shows (in capitals). version, author, description: shown when deleting.
name=__NAME__
version=1.0.0
author=BadgeOS
description=__NAME__: a new app made from the template.
# What the app may use, comma-separated: sign, request, net, espnow, contacts, history, storage.
# Empty: drawing, buttons, LEDs and the badge's public identity only. sign and request ask the
# person once, on the first launch.
permissions=
min_api=2
# Optional launcher keys:
#   category=games   list the app in the launcher's GAMES folder (any name: [a-z0-9_-])
#   hidden=1         not on the launcher (still starts over serial; for test fixtures)
#   profile=dev      scripts/push-apps.sh release leaves it out
#   include=<app>    push <app>'s files with this one, except its config.lua and app.ini

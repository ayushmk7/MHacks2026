name: badgepay   # fixed project name, so container and volume do not depend on the folder name
services:
  db:
    image: timescale/timescaledb:2.30.2-pg17
    ports: ["127.0.0.1:5433:5432"]
    environment:
      POSTGRES_PASSWORD: badgepay
      POSTGRES_DB: badgepay
    volumes: ["badgepay-db:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d badgepay"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  badgepay-db: {}
